<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="famBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d1b14"/>
      <stop offset="100%" stop-color="#180e0a"/>
    </linearGradient>
    <linearGradient id="woodGavel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a0522d"/>
      <stop offset="50%" stop-color="#693318"/>
      <stop offset="100%" stop-color="#3d1b08"/>
    </linearGradient>
    <linearGradient id="goldBrass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#famBg)"/>
  <!-- Law Book -->
  <g transform="translate(90, 80)">
    <rect x="0" y="30" width="220" height="40" rx="4" fill="#3b2014" stroke="#542e1d" stroke-width="2"/>
    <rect x="5" y="34" width="210" height="6" fill="url(#goldBrass)"/>
    <text x="110" y="56" fill="#f5d77f" font-family="'EB Garamond', serif" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="2">FAMILY LAW CODE</text>
  </g>
  <!-- Gavel resting on book -->
  <g transform="translate(160, 40) rotate(-25 60 40)">
    <!-- Head -->
    <rect x="25" y="10" width="85" height="36" rx="6" fill="url(#woodGavel)"/>
    <rect x="20" y="6" width="12" height="44" rx="3" fill="url(#woodGavel)"/>
    <rect x="98" y="6" width="12" height="44" rx="3" fill="url(#woodGavel)"/>
    <rect x="58" y="10" width="18" height="36" fill="url(#goldBrass)"/>
    <!-- Handle -->
    <rect x="62" y="46" width="10" height="95" rx="4" fill="url(#woodGavel)"/>
    <rect x="60" y="130" width="14" height="22" rx="3" fill="url(#woodGavel)"/>
  </g>
  <text x="200" y="215" fill="#f5d77f" font-family="'EB Garamond', serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="1.5">CHILD CUSTODY &amp; FAMILY SETTLEMENT</text>
</svg>
