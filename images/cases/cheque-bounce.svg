<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="chqBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="woodGavel2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#854d0e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="stampRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#chqBg)"/>
  <!-- Bank Cheque Leaf -->
  <g transform="translate(60, 45) rotate(-5 140 60)">
    <rect x="0" y="0" width="280" height="120" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <rect x="15" y="15" width="80" height="12" fill="#0284c7" opacity="0.8"/>
    <text x="20" y="24" fill="#ffffff" font-family="sans-serif" font-size="8" font-weight="bold">NATIONAL BANK</text>
    <rect x="200" y="12" width="65" height="16" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="205" y="23" fill="#64748b" font-family="sans-serif" font-size="7">DD/MM/YYYY</text>
    <line x1="20" y1="48" x2="260" y2="48" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="22" y="44" fill="#64748b" font-family="sans-serif" font-size="8">PAY</text>
    <line x1="20" y1="72" x2="190" y2="72" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="195" y="60" width="70" height="20" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
    <text x="200" y="74" fill="#0f172a" font-family="sans-serif" font-size="10" font-weight="bold">&#8377; 15,00,000/-</text>
    <!-- Dishonour Stamp -->
    <g transform="translate(90, 30) rotate(-15 45 20)">
      <rect x="0" y="0" width="120" height="34" rx="4" fill="none" stroke="url(#stampRed)" stroke-width="3" stroke-dasharray="4,2"/>
      <text x="60" y="23" fill="url(#stampRed)" font-family="sans-serif" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="1">DISHONOURED</text>
    </g>
  </g>
  <text x="200" y="215" fill="#0f172a" font-family="'EB Garamond', serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="1">SECTION 138 NEGOTIABLE INSTRUMENTS ACT</text>
</svg>
