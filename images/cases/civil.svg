<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="civBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <linearGradient id="goldCiv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#civBg)"/>
  <!-- Law Books Stack -->
  <g transform="translate(100, 50)">
    <!-- Book 1 (Bottom) -->
    <rect x="0" y="70" width="200" height="34" rx="4" fill="#78350f" stroke="#92400e" stroke-width="1.5"/>
    <rect x="5" y="74" width="190" height="4" fill="url(#goldCiv)"/>
    <!-- Book 2 (Middle) -->
    <rect x="15" y="38" width="180" height="32" rx="4" fill="#1e3a5f" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="20" y="42" width="170" height="4" fill="url(#goldCiv)"/>
    <text x="105" y="60" fill="#f8fafc" font-family="'EB Garamond', serif" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="1">CIVIL PROCEDURE CODE</text>
    <!-- Scales on top -->
    <g transform="translate(70, -25)">
      <line x1="30" y1="10" x2="30" y2="55" stroke="url(#goldCiv)" stroke-width="3"/>
      <line x1="5" y1="20" x2="55" y2="20" stroke="url(#goldCiv)" stroke-width="3"/>
      <!-- Left Pan -->
      <line x1="5" y1="20" x2="-2" y2="38" stroke="url(#goldCiv)" stroke-width="1.5"/>
      <line x1="5" y1="20" x2="12" y2="38" stroke="url(#goldCiv)" stroke-width="1.5"/>
      <path d="M-8,38 Q5,48 18,38" fill="none" stroke="url(#goldCiv)" stroke-width="2"/>
      <!-- Right Pan -->
      <line x1="55" y1="20" x2="48" y2="38" stroke="url(#goldCiv)" stroke-width="1.5"/>
      <line x1="55" y1="20" x2="62" y2="38" stroke="url(#goldCiv)" stroke-width="1.5"/>
      <path d="M42,38 Q55,48 68,38" fill="none" stroke="url(#goldCiv)" stroke-width="2"/>
    </g>
  </g>
  <text x="200" y="215" fill="#fde047" font-family="'EB Garamond', serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="1.5">PROPERTY &amp; COMMERCIAL CIVIL SUITS</text>
</svg>
