<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="crimBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="cuffMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="crimGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#crimBg)"/>
  <!-- Handcuffs & Trial Defense -->
  <g transform="translate(110, 45)">
    <!-- Left Handcuff -->
    <ellipse cx="45" cy="65" rx="32" ry="24" fill="none" stroke="url(#cuffMetal)" stroke-width="7"/>
    <ellipse cx="45" cy="65" rx="22" ry="14" fill="none" stroke="#0c0a09" stroke-width="4"/>
    <rect x="70" y="60" width="12" height="10" rx="2" fill="url(#cuffMetal)"/>
    <!-- Chain -->
    <ellipse cx="90" cy="65" rx="10" ry="6" fill="none" stroke="url(#cuffMetal)" stroke-width="4"/>
    <ellipse cx="102" cy="65" rx="10" ry="6" fill="none" stroke="url(#cuffMetal)" stroke-width="4"/>
    <!-- Right Handcuff -->
    <ellipse cx="145" cy="65" rx="32" ry="24" fill="none" stroke="url(#cuffMetal)" stroke-width="7"/>
    <ellipse cx="145" cy="65" rx="22" ry="14" fill="none" stroke="#0c0a09" stroke-width="4"/>
  </g>
  <text x="200" y="215" fill="#facc15" font-family="'EB Garamond', serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="1.5">CRIMINAL TRIAL DEFENSE &amp; FIR QUASHING</text>
</svg>
