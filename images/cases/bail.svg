<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="prisonBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="barMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="50%" stop-color="#71717a"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
    <linearGradient id="goldKey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#prisonBg)"/>
  <!-- Jail Bars -->
  <g opacity="0.45">
    <rect x="60" y="0" width="14" height="240" fill="url(#barMetal)"/>
    <rect x="130" y="0" width="14" height="240" fill="url(#barMetal)"/>
    <rect x="200" y="0" width="14" height="240" fill="url(#barMetal)"/>
    <rect x="270" y="0" width="14" height="240" fill="url(#barMetal)"/>
    <rect x="340" y="0" width="14" height="240" fill="url(#barMetal)"/>
  </g>
  <!-- Gavel Breaking the Bars / Golden Key -->
  <g transform="translate(140, 45)">
    <!-- Golden Key of Freedom / Bail -->
    <circle cx="60" cy="50" r="28" fill="none" stroke="url(#goldKey)" stroke-width="8"/>
    <circle cx="60" cy="50" r="14" fill="none" stroke="url(#goldKey)" stroke-width="3"/>
    <rect x="60" y="74" width="12" height="70" rx="3" fill="url(#goldKey)"/>
    <rect x="72" y="115" width="22" height="8" rx="2" fill="url(#goldKey)"/>
    <rect x="72" y="132" width="18" height="8" rx="2" fill="url(#goldKey)"/>
  </g>
  <text x="200" y="215" fill="#facc15" font-family="'EB Garamond', serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="1.5">REGULAR &amp; ANTICIPATORY BAIL (BNSS)</text>
</svg>
