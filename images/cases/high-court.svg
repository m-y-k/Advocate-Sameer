<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="hcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="hcDome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#hcBg)"/>
  <!-- High Court Pillars & Dome Architectural Silhouette -->
  <g transform="translate(100, 30)">
    <!-- Central Dome -->
    <path d="M70,50 Q100,5 130,50 Z" fill="url(#hcDome)"/>
    <rect x="96" y="2" width="8" height="15" fill="url(#hcDome)"/>
    <!-- Pediment Triangle -->
    <polygon points="10,65 100,38 190,65" fill="#f8fafc"/>
    <rect x="15" y="65" width="170" height="8" fill="#e2e8f0"/>
    <!-- Columns -->
    <rect x="25" y="73" width="12" height="70" fill="#f8fafc"/>
    <rect x="52" y="73" width="12" height="70" fill="#f8fafc"/>
    <rect x="80" y="73" width="12" height="70" fill="#f8fafc"/>
    <rect x="108" y="73" width="12" height="70" fill="#f8fafc"/>
    <rect x="136" y="73" width="12" height="70" fill="#f8fafc"/>
    <rect x="163" y="73" width="12" height="70" fill="#f8fafc"/>
    <!-- Plinth / Stairs -->
    <rect x="10" y="143" width="180" height="8" fill="#e2e8f0"/>
    <rect x="0" y="151" width="200" height="10" fill="#cbd5e1"/>
  </g>
  <text x="200" y="215" fill="#fef08a" font-family="'EB Garamond', serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="1.5">WRITS, APPEALS &amp; REVISIONS</text>
</svg>
