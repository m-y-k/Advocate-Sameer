<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Balance scale — simplified for favicon -->
  <!-- Pole -->
  <rect x="15.2" y="7" width="1.6" height="16" fill="#9A7B2F"/>
  <!-- Beam -->
  <rect x="6" y="10" width="20" height="1.5" fill="#9A7B2F"/>
  <!-- Left pan -->
  <line x1="8" y1="11.5" x2="8" y2="18" stroke="#9A7B2F" stroke-width="1.2"/>
  <line x1="12" y1="11.5" x2="12" y2="18" stroke="#9A7B2F" stroke-width="1.2"/>
  <path d="M6.5 18 Q10 21 13.5 18" fill="none" stroke="#9A7B2F" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Right pan -->
  <line x1="20" y1="11.5" x2="20" y2="18" stroke="#9A7B2F" stroke-width="1.2"/>
  <line x1="24" y1="11.5" x2="24" y2="18" stroke="#9A7B2F" stroke-width="1.2"/>
  <path d="M18.5 18 Q22 21 25.5 18" fill="none" stroke="#9A7B2F" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Base -->
  <rect x="12" y="23" width="8" height="1.5" rx="0.75" fill="#9A7B2F"/>
  <!-- Center dot -->
  <circle cx="16" cy="10" r="1.5" fill="#9A7B2F"/>
</svg>
